spring.application.name=cineflow-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cineflow}
spring.datasource.username=${DB_USERNAME:cineflow_user}
spring.datasource.password=${DB_PASSWORD:6969}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging.level.org.springframework=INFO
logging.level.com.cineflow=DEBUG

# JWT secret: override APP_JWT_SECRET in your local terminal; never commit production secrets.
app.jwt.secret=${APP_JWT_SECRET:local-dev-secret-change-this-to-at-least-32-chars}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
logging.level.org.springframework.security=TRACE
logging.level.com.cineflow.auth.service.JwtAuthenticationFilter=DEBUG
logging.level.org.springframework.security=DEBUG

logging.level.com.cineflow=DEBUG
logging.level.org.springframework.web=DEBUG
server.error.include-message=always
server.error.include-binding-errors=always